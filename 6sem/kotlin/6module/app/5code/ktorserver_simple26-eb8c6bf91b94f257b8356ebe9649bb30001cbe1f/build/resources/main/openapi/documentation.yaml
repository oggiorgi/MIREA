openapi: 3.0.0
info:
  title: Nobel Prize API
  description: API for Nobel Prize data with user favorites
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: User created successfully

  /prizes:
    get:
      summary: Get all Nobel prizes
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of prizes

  /prizes/{year}/{category}:
    get:
      summary: Get prize details by year and category
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Prize details

  /prizes/{year}/{category}/laureates:
    get:
      summary: Get laureates for a prize
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of laureates

  /users/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile

  /users/me/prizes:
    get:
      summary: Get user's favorite prizes
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of favorite prizes
    post:
      summary: Add prize to favorites
      security:
        - bearerAuth: []
      parameters:
        - name: prizeId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Prize added
    delete:
      summary: Remove prize from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: prizeId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Prize removed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT